<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Academic Tracking Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page page--login">
  <canvas id="bg-particles" class="particles-canvas" aria-hidden="true"></canvas>
  <div class="gradient-orb gradient-orb--1"></div>
  <div class="gradient-orb gradient-orb--2"></div>

  <div class="layout layout--narrow">
    <header class="glass-header glass-header--center">
      <div class="brand brand--center">
        <span class="brand-icon" aria-hidden="true">SE</span>
        <div>
          <h1>Portal sign-in</h1>
          <p class="tagline">Session-based access · Academic portal</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="glass-card login-card">
        <h2 class="card-title">Log in</h2>
        <p class="card-sub">Use your assigned credentials to open the academic portal.</p>

        {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}

        <form class="form login-form" method="post" action="{{ url_for('auth.login') }}" novalidate>
          {% if next_url %}
          <input type="hidden" name="next" value="{{ next_url }}">
          {% endif %}
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-glow login-submit">Sign in</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer glass-footer">
      <p>Use your assigned account credentials to access the portal securely.</p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
</body>
</html>
